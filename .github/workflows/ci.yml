name: tests

# On every push to main, on any pull request, and on demand. The
# repository is public (2026-09-14), and GitHub's hosted runners are
# free without a minute limit for a public repository — the "not on
# push, no schedule" rule of 2026-09-01 was the private allowance
# talking (2 000 minutes a month, 54 a push), and that reason is gone.
#
# What CI earns its keep for is the part a laptop cannot do: a *clean
# machine*. Nothing pip-installed by hand, nothing left over, nothing
# but what `pyproject.toml` actually declares — which is how the
# mkdocs-gen-files import that worked locally and failed here was
# caught, and how PyYAML missing from the dev extra and a STEP reader
# written against one OCP binding were caught (2026-09-13). The local
# suite and lint pass is still the gate; this is the second opinion,
# taken on every push now that it is free. Still no schedule: a run
# with nothing new to test answers nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request pushed to twice, or *Run workflow* pressed twice,
# leaves a superseded run burning minutes for an answer nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 60: a green run at four workers took 12 minutes on a four-core
    # Linux box once the windows died at teardown (2026-09-13); the cap
    # exists to stop a hung run burning minutes, not to race the suite.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # both, every run: `requires-python` promises 3.12, and now
        # that the minutes are free there is no bill to halve by
        # testing it only on demand (2026-09-14)
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt and VTK need a graphics stack even to render off screen: the
      # tests run headless (conftest sets QT_QPA_PLATFORM=offscreen) but
      # pyvista still opens a GL context for its screenshots, which is
      # what xvfb below provides.
      - name: Install the graphics libraries Qt and VTK link against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libopengl0 libglx-mesa0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libnss3 \
            libxdamage1 libxrandr2 libasound2t64

      - name: Install visualdynamics and its test tools
        run: pip install -e '.[dev,step]'

      - name: Lint
        run: ruff check .

      - name: Test
        # Chromium (the report editor's engine) has no usable sandbox in
        # a container, and asks for a GPU that is not there
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
          # Coverage on one interpreter only: instrumentation is not free
          # on a run of the better part of half an hour, and the number does not differ
          # between them. `--cov-report=` writes the data and prints
          # nothing; the report is assembled once, after the demo step.
          COV: ${{ matrix.python-version == '3.13'
                   && '--cov=visualdynamics --cov-report=' || '' }}
        # --durations: the run takes the better part of half an hour here against three and a
        # half on the machine it was written on, and twice a hosted
        # runner has been reclaimed mid-job ("the runner has received a
        # shutdown signal") in the same silent three-minute stretch a
        # quarter of the way through. Before changing how it runs, find
        # out what that stretch is.
        # -n auto (four on this runner). For one day this was -n 2: a
        # worker grew to 2.7 GB because every window a test made
        # outlived its test (deleteLater never delivered, a lambda on
        # the application's style hints — 2026-09-13), and four of them
        # on a 16 GB runner was what systemd-oomd stopped with a SIGTERM.
        # With windows dying at teardown, four workers peak at 7.4 GB
        # together in an 8 GB container and a full run takes 12 minutes;
        # tests/test_window_lifetime.py keeps it that way. A worker that
        # dies is replaced (xdist's default) and its test reported as
        # failed: a crash must not hide the rest of the suite.
        run: xvfb-run -a python -m pytest tests -q -n auto --durations=20 $COV

      # The demonstration model, deselected from the run above because it
      # is a forty-six-second eigensolution nobody wants on every edit. It
      # is what the website and the docs are built from, so it is checked
      # here rather than left to rot.
      - name: Test the demonstration model
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
          COV: ${{ matrix.python-version == '3.13'
                   && '--cov=visualdynamics --cov-append --cov-report=' || '' }}
        run: xvfb-run -a python -m pytest tests -q -m slow -n auto $COV

      # Both runs together. Measuring only the first would read
      # `demo/drone.py` at 12% and call the speedup a regression: the
      # demonstration model is tested, just not on every edit.
      - name: Coverage
        if: matrix.python-version == '3.13'
        run: |
          total=$(python -m coverage report --format=total)
          {
            echo "## Coverage: ${total}%"
            echo
            echo "Statements reached by the suite and the demonstration"
            echo "model together, on Python ${{ matrix.python-version }}."
            echo
            echo "<details><summary>By module</summary>"
            echo
            python -m coverage report --format=markdown
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage html
          # The floor (Brandon, 2026-09-16): a pull request that adds
          # code without tests goes red the way a license violation
          # does. Measured at 92% on the suite alone and a little more
          # with the demonstration model appended, the day it was set;
          # raise it when the number rises, never lower it to pass.
          python -m coverage report --fail-under=90 > /dev/null

      - name: Keep the coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

  # The head branch of a pull request is named for what it carries:
  # `fix/`, `feature/`, `docs/` or `tooling/` and a short lower-case
  # slug — the one branch scheme the project has (PLAN.md, "Branches",
  # 2026-09-19). Checked here so a pull request from any fork wears
  # it, and required on `main` so a branch that does not cannot merge.
  # The canonical repository itself takes no working branches at all:
  # a ruleset refuses their creation, the owner included, so the scheme
  # only ever has to be checked on the way in. `sync/` is the owner's
  # publishing tool. Skipped on a push to main, where there is no head
  # branch to name. tests/test_public_tree.py reads the pattern out of
  # this file rather than writing it a second time.
  branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The head branch is named by the scheme
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          pattern='^(fix|feature|docs|tooling)/[a-z0-9][a-z0-9.-]*$|^sync/[0-9]{8}-[0-9]{4}$'
          if [[ $HEAD =~ $pattern ]]; then
            echo "$HEAD"
          else
            echo "::error::The branch '$HEAD' is not named by the scheme: fix/, feature/, docs/ or tooling/, then a short lower-case slug of letters, digits and hyphens — fix/decade-axis-ticks, say. Rename the branch in your fork (the pull request follows the rename) and push again."
            exit 1
          fi

  # The documentation site, built here as a check and published only by
  # the release workflow into visualdynamics.org/documentation/ — GitHub
  # Pages and Read the Docs are not connected. The site comes back as an
  # artifact to read, and `properdocs serve` is how it is read while
  # working. --strict fails on
  # a broken cross-reference, which is what holds the guides to the API
  # reference now that the reference is generated rather than committed.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install visualdynamics and the documentation tools
        run: pip install -e '.[docs]'

      - name: Build the site
        env:
          DISABLE_MKDOCS_2_WARNING: 'true'
        run: properdocs build --strict --site-dir site

      - name: Keep the site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
