name: cla

# Nothing merges unsigned. On every pull request the CLA Assistant
# action checks whether the author's GitHub account has signed CLA.md;
# if not, it comments with the document and the sentence to reply
# with, and reports a failing status until that reply arrives. The
# signatures live on their own branch, `cla-signatures`, never on
# main: main is refreshed from the working tree by
# tools/build_public_tree.py, which clears everything it manages, and a
# signature file on main would be wiped by the next sync.
#
# Dormant until a pull request exists — no schedule, no push trigger.
# An issue comment still starts a run, which exits in seconds unless
# the comment is the signing sentence or a recheck.
# With the repository public, branch protection on main makes this
# check required (REMAINING-TASKS.md, "Release"); on the free plan a
# private repository cannot carry branch protection at all.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/visualdynamics/visualdynamics/blob/main/CLA.md'
          path-to-signatures: 'signatures/cla.json'
          # the branch has to exist before the first pull request: the
          # action records signatures on it and fails outright, before
          # consulting the allowlist, when it is not there — which is
          # what the first gated pull request met (2026-09-15). Made
          # once, as an orphan holding an empty signatures/cla.json.
          branch: 'cla-signatures'
          allowlist: 'bzwink,dependabot[bot]'
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Code contributions to Visual
            Dynamics are by invitation and arrive under the contributor
            licence agreement — please read it at the link, and if you
            agree, reply to this comment with the sentence below. Signing
            once covers every later pull request.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
          lock-pullrequest-aftermerge: false
