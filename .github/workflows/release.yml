name: release

# **Tags and the button, never a push.** Nightly builds of a project
# with one author would make artifacts nobody downloads and version
# numbers that mean nothing.
#
# All four packages build here (2026-10-10): Linux, Windows, and the
# macOS pair on GitHub's own Apple-silicon and Intel runners, signed
# with the Developer ID certificate and notarized from the repository's
# secrets, so a tag drafts the whole release with no Mac involved. The
# macOS jobs were off by default while the repository's minutes were
# metered at 10x for macOS; a public repository's are free. A dispatch
# builds all four as a test and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      reserve:
        description: 'Only reserve the name on PyPI with an empty placeholder (no builds)'
        type: boolean
        default: false
      site:
        description: 'Only redeploy the website from this tree (no builds; the manifest names the latest release)'
        type: boolean
        default: false
  # The site follows the release, not the push (Brandon, 2026-09-01):
  # when the draft release is *published*, the `site` job below builds
  # the documentation, writes the update manifest from the release
  # itself, and deploys the whole site. What a reader sees then matches
  # what they can install, and the manifest can never name assets that
  # do not exist yet — the release is already public when it is written.
  release:
    types: [published]

permissions:
  contents: write        # to create the release and attach the builds

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false      # never abandon a half-published release

jobs:
  linux:
    if: github.event_name != 'release' && !inputs.reserve && !inputs.site
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.13', cache: pip}
      # The same list packaging/build_linux.sh reads, so a runner and a
      # container install the same thing. A hand-copied list here is
      # what made the first two attempts fail on binutils and libkrb5-3.
      - name: Install what a Linux build needs
        run: |
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' packaging/linux/apt-packages.txt | tr '\n' '\0' |
            xargs -0 sudo apt-get satisfy -y -qq --no-install-recommends
      # [step]: the CAD kernel ships in every packaged build (the spec
      # collects OCP only if it is installed — without the extra the
      # runner's package silently lacked STEP/IGES import, 2026-09-03)
      - run: pip install -e '.[step,app]' pyinstaller pillow
      - name: Build
        env:
          # appimagetool is itself an AppImage and needs FUSE, which a
          # runner has not got
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
          packaging/build_linux.sh
      - uses: actions/upload-artifact@v7
        with: {name: linux, path: dist/*.AppImage, retention-days: 1}

  windows:
    if: github.event_name != 'release' && !inputs.reserve && !inputs.site
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.13', cache: pip}
      # [step]: the CAD kernel ships in every packaged build (the spec
      # collects OCP only if it is installed — without the extra the
      # runner's package silently lacked STEP/IGES import, 2026-09-03)
      - run: pip install -e '.[step,app]' pyinstaller pillow
      - run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      # Run what was just built, on the real Windows this runner is:
      # install silently, open a project in the installed application,
      # require a titled window, photograph the screen. The runner has
      # an interactive desktop, so the screenshots show the actual
      # application — the closest thing to a Windows machine the
      # maintainer has.
      - name: Smoke-test the installed application
        run: powershell -ExecutionPolicy Bypass -File packaging\smoke_windows.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: windows-smoke, path: dist/smoke/*, retention-days: 7}
      - uses: actions/upload-artifact@v7
        with: {name: windows, path: dist/*setup.exe, retention-days: 1}

  # One job per architecture, each on a runner of that architecture —
  # the desk cross-built Intel under Rosetta, a runner needs no such
  # trick. The secrets (packaging/README.md, "Signing on the runners"):
  # MACOS_CERTIFICATE and MACOS_CERTIFICATE_PASSWORD, the Developer ID
  # Application certificate exported as a .p12 and base64'd;
  # NOTARY_APPLE_ID and NOTARY_PASSWORD, an app-specific password. On a
  # tag the build refuses to finish unsigned or unnotarized
  # (VD_REQUIRE_NOTARIZED); dispatched, it makes whatever it can.
  macos:
    if: github.event_name != 'release' && !inputs.reserve && !inputs.site
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-latest, arch: arm64}
          - {runner: macos-26-intel, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.13', cache: pip}
      # [step]: the CAD kernel ships in every packaged build (the spec
      # collects OCP only if it is installed — without the extra the
      # runner's package silently lacked STEP/IGES import, 2026-09-03)
      - run: pip install -e '.[step,app]' pyinstaller pillow
      - name: Sparkle, the updater the app carries
        run: |
          packaging/fetch_sparkle.sh "$RUNNER_TEMP/sparkle"
          echo "SPARKLE=$RUNNER_TEMP/sparkle/Sparkle.framework" >> "$GITHUB_ENV"
      - name: The signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            packaging/ci_signing.sh
          else
            echo "no MACOS_CERTIFICATE secret: the build is ad-hoc signed"
          fi
      - name: Build, sign and notarize
        env:
          PYTHON: python
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          VD_REQUIRE_NOTARIZED: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
        run: packaging/build_macos.sh
      # the image people download, and the zip Sparkle downloads (made
      # only once the app is notarized and stapled)
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 1

  publish:
    # macos included, and it was not: the job built a .dmg, uploaded
    # it, and `publish` never waited for it — so a tagged release
    # would have gone out with the Linux and Windows builds and
    # whatever the macOS job had managed to upload by then, which is a
    # race rather than a guarantee. Found while writing the website's
    # download section, where the empty macOS button would have been
    # the first anyone knew (2026-08-25).
    #
    # While the macOS pair was built on the desk the macos job was
    # skipped on a tag, and `!cancelled()` with per-job result checks is
    # what let publish run beside a skipped need (2026-09-03). The pair
    # builds here now, so all three are required: a release that drafts
    # without its Mac images is the half-release this job exists to
    # prevent. A failed build is rerun; nothing is drafted until it is
    # green.
    needs: [linux, windows, macos]
    if: >-
      !cancelled()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.linux.result == 'success'
      && needs.windows.result == 'success'
      && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # the builds only: the Windows smoke test's screenshot and logs
      # are artifacts too, and taking every artifact attached them to
      # the release and tripped over an empty stdout.log, which GitHub
      # refuses as an asset (the first tag, 2026-09-14)
      - uses: actions/download-artifact@v8
        with: {path: builds, merge-multiple: true, pattern: '{linux,windows,macos-*}'}
      # SHA256SUMS beside the builds, in sha256sum's own format so
      # `shasum -a 256 -c SHA256SUMS` verifies a download — the
      # downloads page promises "notes and checksums" (2026-09-11).
      # Every build is here, the macOS images and update zips with the
      # rest; the updates job below adds nothing it does not also sum.
      - name: Checksums
        run: cd builds && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # Release assets, **not** Actions artifacts: artifacts count
      # against a 500 MB storage quota that three ~1 GB builds would
      # exhaust on the first release. Release assets are a separate,
      # effectively unlimited store — which is why the jobs above keep
      # theirs for a single day, just long enough to be collected here.
      - uses: softprops/action-gh-release@v3
        with:
          files: builds/*
          draft: true          # look at it before the world does
          generate_release_notes: true

  # The macOS app's Sparkle updates, onto the draft once it exists —
  # after publish, because Sparkle shows the release's own notes beside
  # Install and those are written when the draft is. Each update zip is
  # signed with the EdDSA key (the SPARKLE_ED_KEY secret, exported once
  # with `generate_keys -x`), deltas are made against the two releases
  # before this one, fetched from their own assets, and the per-arch
  # appcasts go up beside them. Publishing the release publishes the
  # feeds: every app reads releases/latest/download/appcast-<arch>.xml.
  updates:
    needs: publish
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {path: dist, merge-multiple: true, pattern: 'macos-*'}
      - name: Sparkle's tools
        run: packaging/fetch_sparkle.sh "$RUNNER_TEMP/sparkle"
      - name: The update zips of the two releases before this one
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 20 \
              --json tagName -q '.[].tagName' |
            grep '^v' | grep -vxF "$GITHUB_REF_NAME" | head -2 |
            while read -r tag; do
              for arch in arm64 x86_64; do
                gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                  --pattern "VisualDynamics-*-macos-$arch.zip" \
                  --dir "$RUNNER_TEMP/updates/$arch"
              done
            done
          ls -R "$RUNNER_TEMP/updates"
      - name: Sign the updates and write the feeds
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          umask 077
          printf '%s' "$SPARKLE_ED_KEY" > "$RUNNER_TEMP/ed.key"
          SPARKLE_ED_KEY_FILE="$RUNNER_TEMP/ed.key" \
          SPARKLE_BIN="$RUNNER_TEMP/sparkle/bin" \
          UPDATE_STORE="$RUNNER_TEMP/updates" \
            packaging/release_updates.sh "$GITHUB_REF_NAME"
          rm -f "$RUNNER_TEMP/ed.key"

  # Everything visualdynamics.org serves, from one directory: the launch
  # pages, the documentation properdocs builds into web/launch/documentation/,
  # and latest.json for File -> Check for Updates. Runs only on the
  # release-published event, so it never sees a tag whose release is
  # still a draft. Needs two repository secrets, both from the
  # Cloudflare dashboard: CLOUDFLARE_API_TOKEN (a token with Cloudflare
  # Pages: Edit on this account, nothing more) and CLOUDFLARE_ACCOUNT_ID.
  # web/README.md walks through making them.
  site:
    # a *version's* release only: the examples release (tag `examples`,
    # 2026-09-14) fired both these jobs, and the site went out with
    # latest.json saying version "examples" until it was redeployed by
    # hand
    # ...or on demand with the `site` input, for a change to the pages
    # themselves between releases — the example tiles' pictures were
    # the first (2026-09-16). The manifest then names whatever release
    # is latest, so the update check keeps its answer.
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
      || (github.event_name == 'workflow_dispatch' && inputs.site)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.13', cache: pip}
      - run: pip install -e '.[docs]'
      - name: Build the documentation into the site
        env:
          DISABLE_MKDOCS_2_WARNING: 'true'
        run: properdocs build --strict
      - name: Write the update manifest from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          NAME: ${{ github.event.release.name }}
        run: |
          if [ -z "$TAG" ]; then
            # a redeploy on demand: the latest release is the one
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
            URL=$(gh release view --repo "$GITHUB_REPOSITORY" --json url -q .url)
            NAME=$(gh release view --repo "$GITHUB_REPOSITORY" --json name -q .name)
            export TAG URL NAME
          fi
          python - <<'EOF'
          import json, os
          version = os.environ['TAG'].removeprefix('v')
          json.dump({'version': version, 'url': os.environ['URL'],
                     'notes': os.environ['NAME'] or f'Visual Dynamics {version}'},
                    open('web/launch/latest.json', 'w'), indent=2)
          print(open('web/launch/latest.json').read())
          EOF
      # From inside the site directory, deploying '.': wrangler reads
      # Pages Functions from ./functions relative to where it *runs*,
      # not from the directory it deploys, so the first release's
      # deploy shipped the pages without /api/requests and the site
      # served index.html in its place (2026-09-14). "Uploading
      # Functions bundle" in the log is the line that says it worked.
      - name: Deploy the site
        working-directory: web/launch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy . --project-name=visualdynamics --branch=main

  # PyPI, by trusted publishing: no token anywhere — PyPI accepts this
  # workflow's own identity, registered once in the account as a
  # pending publisher (packaging/README.md, "PyPI"). Two jobs, one
  # name:
  #
  # `reserve` holds the name before the first release with an empty
  # placeholder (version 0.0.0, a README, no code): the name was free
  # in August 2026 and stays free only until somebody takes it. Run
  # by hand, once. Nothing of the software leaves the repository.
  #
  # `pypi` publishes the real distribution when the release is
  # *published* — the same moment the site deploys — built from this
  # checkout, which is the public tree and nothing else.
  reserve:
    if: github.event_name == 'workflow_dispatch' && inputs.reserve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-python@v7
        with: {python-version: '3.13'}
      - name: Build the placeholder
        run: |
          mkdir -p placeholder/visualdynamics
          cat > placeholder/pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools>=75"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "visualdynamics"
          version = "0.0.0"
          description = "Visual Dynamics, a units-aware structural dynamics toolset. A placeholder holding the name; the first release is on its way."
          readme = "README.md"
          requires-python = ">=3.12"
          authors = [{ name = "Brandon Zwink" }]
          classifiers = ["Development Status :: 1 - Planning"]

          [project.urls]
          Homepage = "https://visualdynamics.org"

          [tool.setuptools]
          packages = ["visualdynamics"]
          EOF
          cat > placeholder/README.md <<'EOF'
          # Visual Dynamics

          A units-aware structural dynamics toolset: geometry, test data,
          mode shapes and reports, from a desktop application or from
          Python. This version is a placeholder that holds the name on
          PyPI; the first release is on its way at https://visualdynamics.org.
          EOF
          echo '# Visual Dynamics: a placeholder holding the name; the first release is on its way.' > placeholder/visualdynamics/__init__.py
          pip install -q build
          cd placeholder && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: placeholder/dist

  pypi:
    # a *version's* release only: the examples release (tag `examples`,
    # 2026-09-14) fired both these jobs, and the site went out with
    # latest.json saying version "examples" until it was redeployed by
    # hand
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.13'}
      - run: pip install -q build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
