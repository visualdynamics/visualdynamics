# Built by ProperDocs, the maintained continuation of MkDocs 1.x, with
# the MaterialX theme, the continuation of Material (2026-09-04): the
# plugins keep their mkdocs- names, and everything below is as it was.
#
# The three names, as CLAUDE.md sets them out: **Visual Dynamics** is
# what a person reads, `visualdynamics` is the import, `.vdyn` is the
# file. A documentation site is read, so it takes the first — and the
# package name still appears everywhere it belongs, in the API pages'
# own headings and in every code sample.
site_name: Visual Dynamics
site_description: Units-aware structural dynamics analysis toolset
# A page of the site, not a host of its own (Brandon, 2026-09-01): the
# build lands in web/launch/documentation/ (gitignored) and rides the
# site's own deploy, so it answers at visualdynamics.org/documentation/
# and the site's nav reaches it. CI's docs job overrides
# site_dir to keep its artifact separate.
site_url: https://visualdynamics.org/documentation/
site_dir: web/launch/documentation
repo_url: https://github.com/visualdynamics/visualdynamics
repo_name: visualdynamics/visualdynamics
edit_uri: edit/main/docs/

docs_dir: docs
# Nothing under docs/ is held back from the published tree: the one
# private record that lived here moved out to the repository root
# with the other working records, because a page mkdocs merely
# excludes still leaves a nav entry titled None (2026-09-02).
# tests/test_public_tree.py fails if a held-back page ever lands
# under docs/ without being excluded here.

# The docstrings *are* the API reference, and they live outside docs_dir,
# so a serve that watched only docs/ would go stale on the half of the
# site that is generated. `properdocs serve` reloads on a docstring now.
watch:
  - src

# No `nav`: the site's navigation is the docs tree itself, so a page
# added — or a whole API module generated — appears without editing
# this file. Titles come from each page's own heading.

theme:
  name: materialx
  # The application's own mark and palette: docs/assets is written by
  # tools/make_docs_assets.py from `visualdynamics.theme` and
  # `draw_app_icon`, so the site cannot drift away from the app it
  # documents (tests/test_docs_assets.py fails if it has).
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.instant
    # deliberately *not* navigation.sections: that renders a group as a
    # flat heading, and the API tree wants packages that collapse
    - navigation.indexes
    - navigation.top
    # The page's own headings — an API module's classes and functions
    # — fold into the left navigation under the page rather than
    # sitting in a separate column: `data` opens one level deeper to
    # DataArray, TimeHistory, Psd... (Brandon, 2026-09-03)
    - toc.integrate
    - search.suggest
    - content.code.copy
    - content.action.edit
  # Follows the reader's system the way the app follows the OS, with the
  # same two schemes and a toggle either way. The colors themselves are
  # in assets/theme.css; `custom` keeps Material's own palettes out of it.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  # The API reference is written at build time by docs/gen_api.py, which
  # walks the package: a module added is a page added, with no list to
  # keep in step. Nothing under docs/api is committed.
  - gen-files:
      scripts:
        - docs/gen_api.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # NumPy sections on the scripting surface — the verbs and
            # classes a script calls — where a Parameters table earns
            # its place for someone arriving without context. Prose
            # everywhere else, because that prose is what explains why
            # the obvious approach was rejected, and a table cannot
            # say that (PRINCIPLES.md, 6).
            #
            # The parser is backward compatible either way: griffe
            # treats unrecognized text as the description, so a
            # prose-only docstring renders exactly as it did under the
            # google parser. Verified by building both, 2026-08-25.
            docstring_style: numpy
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: false
            members_order: source
            group_by_category: true
            show_category_heading: true
            inherited_members: false
            filters: ["!^_"]
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_source: true
            show_bases: true
            annotations_path: brief
            summary:
              attributes: true
              functions: true
              classes: true
            unwrap_annotated: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      # with toc.integrate this is how deep the left navigation opens:
      # an API page's module and its classes and functions, not every
      # method and attribute of every class (Brandon, 2026-09-03)
      toc_depth: 4
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  # \( \) and \[ \] pass through to MathJax in the browser — the one
  # place the site reaches beyond itself. Viewed offline the equations
  # fall back to readable TeX rather than breaking the page.
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - assets/theme.css

extra_javascript:
  - assets/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js

extra:
  # the header mark leads back to the site the docs are a page of
  homepage: https://visualdynamics.org
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/visualdynamics/visualdynamics
