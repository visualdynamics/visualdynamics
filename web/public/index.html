<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Dynamics</title>
<meta name="description" content="Visual Dynamics. Coming soon.">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Visual Dynamics">
<meta property="og:description" content="Coming soon.">
<meta property="og:image" content="mark.png">
<meta property="og:type" content="website">
<style>
/* The application's own palette, from visualdynamics.theme — the page and
   the program it announces wear one set of colors. */
:root {
  --bg-top:    #0f1014;
  --bg-bottom: #31353d;
  --ink:       #e8e8ea;
  --muted:     #9a9aa2;
  --accent:    #ffb020;   /* scene_highlight */
  --rule:      #3a3f49;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: 8vh 6vw;
  background: radial-gradient(120% 100% at 50% 0%,
              var(--bg-bottom) 0%, var(--bg-top) 70%);
  color: var(--ink);
  font: 400 clamp(16px, 1.15vw + 13px, 20px)/1.65
        ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
        sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
main { max-width: 44rem; text-align: center; }
img.mark {
  width: clamp(112px, 16vw, 168px);
  height: auto;
  margin-bottom: 2.2rem;
  filter: drop-shadow(0 10px 30px rgba(0, 0, 0, .45));
}
h1 {
  margin: 0 0 2.2rem;
  font-size: clamp(2.1rem, 5.2vw, 3.6rem);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
p.soon {
  display: inline-block;
  margin: 0 0 2.6rem;
  padding: .5rem 1.15rem;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--accent);
  font-size: .82em;
  letter-spacing: .09em;
  text-transform: uppercase;
}
footer {
  border-top: 1px solid var(--rule);
  padding-top: 1.6rem;
  color: var(--muted);
  font-size: .84em;
}
a { color: var(--ink); text-decoration-color: var(--rule); }
a:hover { text-decoration-color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  main { animation: rise .7s cubic-bezier(.2, .7, .3, 1) both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
}
</style>
</head>
<body>
<main>
  <img class="mark" src="mark.png"
       alt="The Visual Dynamics mark">
  <h1>Visual Dynamics</h1>
  <p class="soon">Coming soon</p>
  <footer>
    <a href="mailto:contact@visualdynamics.org">contact@visualdynamics.org</a><br>
    &copy; 2026 Brandon Zwink. All rights reserved.
  </footer>
</main>
</body>
</html>
